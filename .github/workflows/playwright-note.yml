# Complete Playwright Automation Framework Structure (BDD + POM + Allure + CI/CD)
# playwright-bdd-framework/
# │
# ├── .github/
# │   └── workflows/
# │       └── playwright.yml                # CI/CD pipeline (GitHub Actions)
# │
# ├── config/
# │   ├── env/
# │   │   ├── dev.env                      # Development environment variables
# │   │   ├── stage.env                    # Staging environment variables
# │   │   └── prod.env                     # Production environment variables
# │   │
# │   └── config.js                        # Loads env files dynamically
# │
# ├── tests/
# │   ├── features/
# │   │   ├── login.feature                # BDD scenarios
# │   │   ├── search.feature
# │   │   └── cart.feature
# │   │
# │   └── step-definitions/
# │       ├── loginSteps.js                # Step definitions linked to feature
# │       ├── searchSteps.js
# │       └── hooks.js                     # Before/After scenario hooks
# │
# ├── pages/
# │   ├── BasePage.js                      # Common reusable methods
# │   ├── LoginPage.js                     # Page Object for login page
# │   ├── HomePage.js                      # Page Object for home page
# │   └── CartPage.js                      # Page Object for cart page
# │
# ├── utils/
# │   ├── testData.js                      # Test data, users, credentials
# │   ├── helpers.js                       # Utility methods
# │   ├── apiHelper.js                     # For API + UI integrated testing
# │   └── logger.js                        # Custom logger using winston/pino
# │
# ├── reports/
# │   ├── allure-results/                  # Allure raw test results
# │   └── allure-report/                   # Generated HTML report
# │
# ├── playwright.config.js                 # Global Playwright settings
# ├── cucumber.config.js                   # CucumberJS + Playwright integration
# ├── package.json                         # Dependencies and npm scripts
