# RETRIES**********************
# To Handle Retries, we can create a test suite using describe and then add retries to that particular test suite so it wont retries the whole script , ony that test suite
# EX:
# test.describe('@stability', () => {

#   test.describe.configure({ retries: 2 });   //this is test suite which will retries 2 times  for test A and test B

#   test('test A', async () => {
#     // retried 2 times
#   });

#   test('test B', async () => {
#     // retried 2 times
#   });

# });

# test('test C outside describe', async () => {   // this is another test suite which will not retries
#   // no retries
# });

# Different Type of RETRIES
# A. Auto waiting (Built in playwright retries)
# Playwright automatically retries - locators, actions, assertions until timeout
# ex: await expect(btn).toBeVisible();
# B. Test Level Retries - Pre-Test Retry (recommended + most precise)
# Ex: test('@some flacky test', async() => {
# }).retry(2);
# C. Suite Level Retries
# Ex: test.describe('@stability', ()=> {
# test.describe.configure({retries:2});
# D. Global Retries(Playwright Config)
# retries:2
# E. Project - level retries(multi-project config)
# Ex: project: [
# { name: 'chrome', retries: 0 },
# { name: 'mobile', retries: 2}
# ]
# F. Overall Retries, CLI level
# EX: npx playwright test --retries=2
# G. Retry Only Failed Test Later
# Ex: npx playwright test --last-failed

