# ✅ What is CI/CD?
# CI/CD stands for:
# CI — Continuous Integration
# CD — Continuous Delivery / Continuous Deployment

# 🟢 CI — Continuous Integration (Developer + Testing Focus)
# Whenever a developer pushes code to repo:

# ✔ code is automatically built
# ✔ automated tests run
# ✔ quality gates execute
# ✔ reports are generated

# In CI pipeline, typically we run:
# unit tests, API tests, smoke UI tests, linting / formatting checks, security scans

# As SDET — your Playwright tests run here 👍

# 🔵 CD — Continuous Delivery (Manual Release Ready)
# Code is:
# ✔ packaged
# ✔ versioned
# ✔ ready to deploy

# But release to production requires manual approval.
# This is used when:
# ✔ business wants control
# ✔ regulated industries (banking, healthcare)
# ✔ human validation needed

# 🟣 CD — Continuous Deployment (Automatic Release)
# Every approved build goes automatically to:
# ✔ staging
# ✔ pre-prod
# ✔ sometimes production

# No manual deployment step.

# 🧠 Simple way to remember it

# CI = Test code automatically
# CD = Deliver code automatically

# 🎯 Why do companies use CI/CD?
# Because manual workflows cause:
# ❌ late bug discovery
# ❌ unstable releases
# ❌ last-minute integration failures
# ❌ human mistakes
# ❌ slow deployments

# CI/CD delivers:
# ✔ faster feedback
# ✔ stable builds
# ✔ repeatable deployments
# ✔ parallel testing
# ✔ visibility via reports
# ✔ confidence to release often

# 🟢 Where does SDET fit in CI/CD?

# SDET role contributes to:
# ✔ deciding which tests run on each pipeline stage
# ✔ keeping tests CI-safe
# ✔ tagging suites (smoke / regression / stability)
# ✔ ensuring retries don’t mask bugs
# ✔ adding reporting & trace artifacts
# ✔ monitoring flaky test behavior
# ✔ breaking pipelines when quality is at risk

# 🟣 Typical Pipeline Execution Flow
# Commit pushed to GitHub →

# 1️⃣ Build
# 2️⃣ Install dependencies
# 3️⃣ Static checks
# 4️⃣ Unit tests
# 5️⃣ API tests
# 6️⃣ UI smoke tests
# 7️⃣ Generate reports
# 8️⃣ Deploy based on pass criteria

# Nightly →
# ✔ Full regression
# ✔ Stability tests
# ✔ Performance tests

# This is exactly how companies run pipelines.
# As an SDET, I design automation tests so they are CI-safe, stateless, grouped by tags, and run selectively in stages — for example smoke tests on PRs, regression tests on main branch, and stability or flaky suites in nightly runs.

# The YAML pipeline defines when each suite runs, how retries and traces behave in CI, and ensures every execution generates useful artifacts like traces, screenshots and Allure reports for debugging and quality tracking.
