name: Playwright CI Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"   # Nightly at 3AM

jobs:

  # ==========================
  # 1️⃣ SMOKE — FAST CHECK (PR ONLY)
  # ==========================
  smoke-tests:
    runs-on: ubuntu-latest
    name: Smoke Suite
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - run: npm ci
    - run: npx playwright install --with-deps

    - name: Run Smoke Tests
      run: npx playwright test --grep "@smoke"

    - name: Upload Trace (Smoke)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trace-smoke
        path: test-results/**/*.zip



  # ==========================
  # 2️⃣ REGRESSION — MAIN BRANCH
  # ==========================
  regression-tests:
    runs-on: ubuntu-latest
    name: Regression Suite
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - run: npm ci
    - run: npx playwright install --with-deps

    - name: Run Regression Tests
      run: >
        npx playwright test
        --grep "@regression"
        --grep-invert "@invalid|@stability|@wip"

    - name: Upload Trace (Regression)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trace-regression
        path: test-results/**/*.zip

    - name: Install Allure CLI
      if: always()
      run: npm install -g allure-commandline

    - name: Generate Allure Report
      if: always()
      run: allure generate allure-results --clean -o allure-report

    - name: Upload Allure Report (Regression)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-regression
        path: allure-report/



  # ==========================
  # 3️⃣ NEGATIVE / INVALID SUITE
  # ==========================
  invalid-tests:
    runs-on: ubuntu-latest
    name: Invalid / Negative Suite
    needs: regression-tests
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - run: npm ci
    - run: npx playwright install --with-deps

    - name: Run Invalid Tests
      run: npx playwright test --grep "@invalid"

    - name: Upload Trace (Invalid)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trace-invalid
        path: test-results/**/*.zip

    - name: Install Allure CLI
      if: always()
      run: npm install -g allure-commandline

    - name: Generate Allure Report
      if: always()
      run: allure generate allure-results --clean -o allure-report

    - name: Upload Allure Report (Invalid)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-invalid
        path: allure-report/



  # ==========================
  # 4️⃣ NIGHTLY STABILITY SUITE
  # ==========================
  stability-tests:
    runs-on: ubuntu-latest
    name: Stability / Flaky Monitoring
    if: github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - run: npm ci
    - run: npx playwright install --with-deps

    - name: Run Stability Tests
      run: npx playwright test --grep "@stability"

    - name: Upload Trace (Stability)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trace-stability
        path: test-results/**/*.zip

    - name: Install Allure CLI
      if: always()
      run: npm install -g allure-commandline

    - name: Generate Allure Report
      if: always()
      run: allure generate allure-results --clean -o allure-report

    - name: Upload Allure Report (Stability)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-stability
        path: allure-report/
